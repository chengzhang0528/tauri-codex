name: tauri-codex CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-codex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64 source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain

      - name: Expose MSYS2 UCRT64 toolchain
        shell: msys2 {0}
        run: echo "TAURI_MINGW_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"

      - name: Bootstrap locked build inputs
        shell: pwsh
        run: npm run bootstrap

      - name: Audit dependencies
        shell: pwsh
        run: npm run audit:dependencies

      - name: Build and test
        shell: pwsh
        run: npm test
