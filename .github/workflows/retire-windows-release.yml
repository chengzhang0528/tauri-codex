name: tauri-codex retire Windows release

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: "要撤回的 Manager 版本"
        required: true
      old_installer_version:
        description: "该 Release 首次发布的 Installer 版本"
        required: true
      replacement_version:
        description: "已公开并激活的替代 Manager 版本"
        required: true

permissions:
  contents: write

concurrency:
  group: tauri-codex-windows-release
  cancel-in-progress: false

jobs:
  retire:
    name: Retire exact public release closure
    runs-on: windows-latest
    timeout-minutes: 15
    environment: oss-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Delete only the superseded OSS objects
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: >-
          npm run publish:release:oss -- retire
          ${{ inputs.old_version }}
          ${{ inputs.old_installer_version }}
          ${{ inputs.replacement_version }}

      - name: Delete the exact old tag, then its GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.old_version }}"
          $releaseId = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id' 2>$null
          if ($LASTEXITCODE -ne 0) { $releaseId = $null }
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Failed to delete exact tag $tag" }
          }
          if ($releaseId) {
            gh api --method DELETE "repos/${{ github.repository }}/releases/$releaseId" --silent
          }
