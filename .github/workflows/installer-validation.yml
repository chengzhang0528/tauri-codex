name: Validate tauri-codex installer candidate

on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'package.json', '.github/workflows/installer-validation.yml']
  pull_request:
    paths: ['app/**', 'scripts/**', 'package.json', '.github/workflows/installer-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-codex-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_BUILD_INSTALLER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain
      - name: Expose the compiler
        shell: msys2 {0}
        run: echo "TAURI_MINGW_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - name: Build and verify without publishing
        shell: pwsh
        run: npm run build:release
