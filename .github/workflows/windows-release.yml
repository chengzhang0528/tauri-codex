name: tauri-codex Windows release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "candidate / publish / finalize / rollback"
        required: true
        type: choice
        options:
          - candidate
          - publish
          - finalize
          - rollback
      version:
        description: "必须与 app/package.json 一致的 Manager 版本"
        required: true
        default: "0.2.0"
      source_commit:
        description: "候选绑定的完整 40 位 source commit"
        required: true
      candidate_run_id:
        description: "publish/finalize/rollback 使用的 candidate workflow run ID"
        required: false
      publish_run_id:
        description: "rollback 使用的 publish workflow run ID"
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: tauri-codex-windows-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable release operation
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      installer-version: ${{ steps.release.outputs.installer-version }}
      source-commit: ${{ steps.release.outputs.source-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Validate operation and release identity
        id: release
        shell: pwsh
        run: |
          $operation = "${{ inputs.operation }}"
          $version = "${{ inputs.version }}"
          $sourceCommit = "${{ inputs.source_commit }}"
          $candidateRunId = "${{ inputs.candidate_run_id }}"
          $publishRunId = "${{ inputs.publish_run_id }}"
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid release version: $version"
          }
          if ($sourceCommit -notmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -ne $sourceCommit) {
            throw "source_commit must resolve to the checked-out 40-character commit"
          }
          if ($operation -ne 'candidate' -and $candidateRunId -notmatch '^[1-9][0-9]*$') {
            throw "$operation requires candidate_run_id"
          }
          if ($operation -eq 'rollback' -and $publishRunId -notmatch '^[1-9][0-9]*$') {
            throw "rollback requires publish_run_id"
          }
          $appVersion = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
          $installerVersion = (Get-Content -Raw app/installer-versions.json | ConvertFrom-Json).installerVersion
          if ($version -ne $appVersion) {
            throw "Release version $version does not match app/package.json $appVersion"
          }
          if (git tag --list "v$version") {
            throw "Tag v$version already exists; this workflow never mutates an existing release"
          }
          if ($operation -eq 'candidate') {
            $latest = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | ForEach-Object { $_.Substring(1) } | Sort-Object { [version]$_ } | Select-Object -Last 1
            if ($latest -and ([version]$version -le [version]$latest)) {
              throw "Release version $version must be newer than $latest"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-version=$installerVersion" >> $env:GITHUB_OUTPUT
          "source-commit=$sourceCommit" >> $env:GITHUB_OUTPUT

  candidate-build:
    name: Build and verify one self-use Windows x64 candidate
    if: inputs.operation == 'candidate'
    needs: [resolve]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source-commit }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain

      - name: Expose MSYS2 UCRT64 toolchain
        shell: msys2 {0}
        run: echo "TAURI_MINGW_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"

      - name: Bootstrap locked build inputs
        shell: pwsh
        run: npm run bootstrap

      - name: Verify source and dependencies
        shell: pwsh
        run: |
          npm run audit:dependencies
          npm test

      - name: Build and verify frozen release candidate
        shell: pwsh
        env:
          TAURI_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: npm run build:release

      - name: Upload frozen candidate
        uses: actions/upload-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64/*
          if-no-files-found: error
          retention-days: 14

  publish-preflight:
    name: Prove OSS publisher admission
    if: inputs.operation == 'publish'
    needs: [resolve]
    runs-on: windows-latest
    timeout-minutes: 10
    environment: oss-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Prove project-scoped write and anonymous readback
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: npm run publish:release:oss -- preflight ${{ needs.resolve.outputs.version }}

  publish-stage:
    name: Stage OSS closure and freeze rollback snapshot
    if: inputs.operation == 'publish'
    needs: [resolve, publish-preflight]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: oss-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Upload and anonymously read back immutable objects
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CANDIDATE_SOURCE_COMMIT: ${{ needs.resolve.outputs.source-commit }}
        run: npm run publish:release:oss -- stage ${{ needs.resolve.outputs.version }}

      - name: Snapshot the exact previous Bootstrap
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CANDIDATE_SOURCE_COMMIT: ${{ needs.resolve.outputs.source-commit }}
        run: npm run publish:release:oss -- snapshot ${{ needs.resolve.outputs.version }}

      - name: Upload rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_rollback_snapshot
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64/bootstrap-rollback-snapshot.json
          if-no-files-found: error
          retention-days: 14

  publish-commit:
    name: Commit OSS Bootstrap from the frozen snapshot
    if: inputs.operation == 'publish'
    needs: [resolve, publish-stage]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: oss-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_rollback_snapshot
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64

      - name: Conditionally commit and read back Bootstrap
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CANDIDATE_SOURCE_COMMIT: ${{ needs.resolve.outputs.source-commit }}
        run: |
          npm run publish:release:oss -- commit ${{ needs.resolve.outputs.version }}
          npm run publish:release:oss -- confirm ${{ needs.resolve.outputs.version }}

  finalize-release:
    name: Verify OSS and create GitHub Release Notes
    if: inputs.operation == 'finalize'
    needs: [resolve]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: oss-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Confirm public OSS candidate identity
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CANDIDATE_SOURCE_COMMIT: ${{ needs.resolve.outputs.source-commit }}
        run: npm run publish:release:oss -- confirm ${{ needs.resolve.outputs.version }}

      - name: Create OSS-only GitHub Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          target_commitish: ${{ needs.resolve.outputs.source-commit }}
          generate_release_notes: true
          body: |
            ## Windows x64 downloads

            - [Installer](https://shared-public-assets.oss-cn-beijing.aliyuncs.com/project-tauri-codex/installers/${{ needs.resolve.outputs.installer-version }}/windows-x64/tauri-codex_${{ needs.resolve.outputs.installer-version }}_x64-setup.exe)
            - [Self-use release manifest](https://shared-public-assets.oss-cn-beijing.aliyuncs.com/project-tauri-codex/releases/${{ needs.resolve.outputs.version }}/windows-x64/manifest.json)

  rollback-bootstrap:
    name: Conditionally restore the previous OSS Bootstrap
    if: inputs.operation == 'rollback'
    needs: [resolve]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: oss-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.resolve.outputs.version }}_windows-x64_rollback_snapshot
          path: .codex-build/releases/${{ needs.resolve.outputs.version }}/windows-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publish_run_id }}

      - name: Restore exact previous Bootstrap only if candidate is still current
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CANDIDATE_SOURCE_COMMIT: ${{ needs.resolve.outputs.source-commit }}
        run: npm run publish:release:oss -- rollback ${{ needs.resolve.outputs.version }}
