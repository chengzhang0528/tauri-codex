name: tauri-codex Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "必须与 app/package.json 一致的版本"
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: tauri-codex-windows-release
  cancel-in-progress: false

jobs:
  oss-preflight:
    name: Verify OSS publisher admission
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 10
    environment: oss-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Prove project-scoped write and anonymous readback
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm run publish:release:oss -- preflight $version

  build:
    name: Build and verify Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}" -replace '^v', ''
          } else {
            "${{ inputs.version }}"
          }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid release version: $version"
          }
          $appVersion = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
          if ($version -ne $appVersion) {
            throw "Release version $version does not match app/package.json $appVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .codex-build/cache
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-windows-x64-build-${{ hashFiles('app/package-lock.json', 'app/build-versions.json', 'app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-x64-build-

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain

      - name: Expose MSYS2 UCRT64 toolchain
        shell: msys2 {0}
        run: echo "TAURI_MINGW_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"

      - name: Bootstrap locked build inputs
        shell: pwsh
        run: npm run bootstrap

      - name: Verify source and dependencies
        shell: pwsh
        run: |
          npm run audit:dependencies
          npm test

      - name: Build release candidate
        shell: pwsh
        env:
          TAURI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run build:release

      - name: Verify release candidate
        shell: pwsh
        env:
          TAURI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run verify:release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-codex_${{ steps.release.outputs.version }}_windows-x64
          path: .codex-build/releases/${{ steps.release.outputs.version }}/windows-x64/*
          if-no-files-found: error

  oss-stage:
    name: Stage verified OSS immutable closure
    if: github.ref_type == 'tag'
    needs: [oss-preflight, build]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: oss-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Download exact Windows x64 candidate
        uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.build.outputs.version }}_windows-x64
          path: .codex-build/releases/${{ needs.build.outputs.version }}/windows-x64

      - name: Upload and read back immutable objects without moving Bootstrap
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: npm run publish:release:oss -- stage ${{ needs.build.outputs.version }}

  github-release:
    name: Publish GitHub Release assets
    if: github.ref_type == 'tag'
    needs: [build, oss-stage]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download exact Windows x64 candidate
        uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.build.outputs.version }}_windows-x64
          path: .codex-build/releases/${{ needs.build.outputs.version }}/windows-x64

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .codex-build/releases/${{ needs.build.outputs.version }}/windows-x64/**/*

  oss-commit:
    name: Verify both origins and commit OSS Bootstrap
    if: github.ref_type == 'tag'
    needs: [build, github-release]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: oss-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Download exact Windows x64 candidate
        uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.build.outputs.version }}_windows-x64
          path: .codex-build/releases/${{ needs.build.outputs.version }}/windows-x64

      - name: Verify GitHub and OSS bytes, then commit Bootstrap last
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: npm run publish:release:oss -- commit ${{ needs.build.outputs.version }}
