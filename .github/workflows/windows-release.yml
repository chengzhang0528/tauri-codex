name: tauri-codex Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "必须与 app/package.json 一致且尚未发布的 Manager 版本"
        required: true
        default: "0.2.0"

permissions:
  contents: read

concurrency:
  group: tauri-codex-windows-release
  cancel-in-progress: false

jobs:
  oss-preflight:
    name: OSS publisher admission
    runs-on: windows-latest
    timeout-minutes: 10
    environment: oss-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Prove project-scoped write and anonymous readback
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: npm run publish:release:oss -- preflight ${{ inputs.version }}

  build-once:
    name: Build and verify one signed Windows x64 candidate
    needs: [oss-preflight]
    runs-on: windows-latest
    timeout-minutes: 60
    environment: oss-release
    outputs:
      version: ${{ steps.release.outputs.version }}
      installer-version: ${{ steps.release.outputs.installer-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: release
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid release version: $version"
          }
          $appVersion = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
          $installerVersion = (Get-Content -Raw app/installer-versions.json | ConvertFrom-Json).installerVersion
          if ($version -ne $appVersion) {
            throw "Release version $version does not match app/package.json $appVersion"
          }
          if (git tag --list "v$version") {
            throw "Tag v$version already exists"
          }
          $latest = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | ForEach-Object { $_.Substring(1) } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if ($latest -and ([version]$version -le [version]$latest)) {
            throw "Release version $version must be newer than $latest"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-version=$installerVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain

      - name: Expose MSYS2 UCRT64 toolchain
        shell: msys2 {0}
        run: echo "TAURI_MINGW_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"

      - name: Import ephemeral Authenticode identity
        shell: pwsh
        env:
          TAURI_CODEX_AUTHENTICODE_PFX_BASE64: ${{ secrets.TAURI_CODEX_AUTHENTICODE_PFX_BASE64 }}
          TAURI_CODEX_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.TAURI_CODEX_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if (-not $env:TAURI_CODEX_AUTHENTICODE_PFX_BASE64 -or -not $env:TAURI_CODEX_AUTHENTICODE_PFX_PASSWORD) {
            throw "Authenticode PFX identity is required"
          }
          New-Item -ItemType Directory -Force .codex-build | Out-Null
          $pfx = Join-Path $PWD '.codex-build/signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TAURI_CODEX_AUTHENTICODE_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:TAURI_CODEX_AUTHENTICODE_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
            if (-not $certificate.Thumbprint) { throw "PFX did not import a signing certificate" }
            "TAURI_CODEX_AUTHENTICODE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Bootstrap locked build inputs
        shell: pwsh
        run: npm run bootstrap

      - name: Verify source and dependencies
        shell: pwsh
        run: |
          npm run audit:dependencies
          npm test

      - name: Build and verify frozen release candidate
        shell: pwsh
        env:
          TAURI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAURI_CODEX_RELEASE_KEY_ID: ${{ secrets.TAURI_CODEX_RELEASE_KEY_ID }}
          TAURI_CODEX_RELEASE_PRIVATE_KEY: ${{ secrets.TAURI_CODEX_RELEASE_PRIVATE_KEY }}
          TAURI_CODEX_RELEASE_PUBLIC_KEY: ${{ secrets.TAURI_CODEX_RELEASE_PUBLIC_KEY }}
          TAURI_CODEX_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.TAURI_CODEX_AUTHENTICODE_TIMESTAMP_URL }}
        run: npm run build:release

      - name: Upload frozen candidate for job handoff only
        uses: actions/upload-artifact@v4
        with:
          name: tauri-codex_${{ steps.release.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ steps.release.outputs.version }}/windows-x64/*
          if-no-files-found: error
          retention-days: 1

  oss-stage:
    name: Stage OSS immutable closure
    needs: [build-once]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: oss-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.build-once.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.build-once.outputs.version }}/windows-x64

      - name: Upload and anonymously read back immutable objects
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CODEX_RELEASE_KEY_ID: ${{ secrets.TAURI_CODEX_RELEASE_KEY_ID }}
          TAURI_CODEX_RELEASE_PUBLIC_KEY: ${{ secrets.TAURI_CODEX_RELEASE_PUBLIC_KEY }}
        run: npm run publish:release:oss -- stage ${{ needs.build-once.outputs.version }}

  oss-commit:
    name: Commit OSS Bootstrap last
    needs: [build-once, oss-stage]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: oss-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/download-artifact@v4
        with:
          name: tauri-codex_${{ needs.build-once.outputs.version }}_windows-x64_candidate
          path: .codex-build/releases/${{ needs.build-once.outputs.version }}/windows-x64

      - name: Re-read closure and commit the mutable Bootstrap
        shell: pwsh
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TAURI_CODEX_RELEASE_KEY_ID: ${{ secrets.TAURI_CODEX_RELEASE_KEY_ID }}
          TAURI_CODEX_RELEASE_PUBLIC_KEY: ${{ secrets.TAURI_CODEX_RELEASE_PUBLIC_KEY }}
        run: npm run publish:release:oss -- commit ${{ needs.build-once.outputs.version }}

  github-release-notes:
    name: Create GitHub tag and OSS-only Release Notes
    needs: [build-once, oss-commit]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-once.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Windows x64 downloads

            - [Installer](https://shared-public-assets.oss-cn-beijing.aliyuncs.com/project-tauri-codex/installers/${{ needs.build-once.outputs.installer-version }}/windows-x64/tauri-codex_${{ needs.build-once.outputs.installer-version }}_x64-setup.exe)
            - [Signed release manifest](https://shared-public-assets.oss-cn-beijing.aliyuncs.com/project-tauri-codex/releases/${{ needs.build-once.outputs.version }}/windows-x64/manifest.json)
