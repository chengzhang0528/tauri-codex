[package]
name = "tauri-codex"
version = "0.1.1"
description = "A Windows desktop wrapper for the bundled OpenAI Codex CLI"
authors = ["tauri-codex maintainers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/chengzhang0528/tauri-codex"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tauri_codex_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
toml_edit = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
semver = "1"
tiny_http = "0.12"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
