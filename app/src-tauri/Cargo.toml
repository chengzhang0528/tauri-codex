[package]
name = "tauri-codex"
version = "0.2.0"
description = "A Windows desktop wrapper for the bundled OpenAI Codex CLI"
authors = ["tauri-codex maintainers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/chengzhang0528/tauri-codex"
edition = "2021"
default-run = "tauri-codex"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "tauri_codex_lib"
crate-type = ["rlib"]

[[bin]]
name = "tauri-codex-manager"
path = "src/manager_main.rs"
required-features = ["custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1.1"
toml_edit = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
semver = "1"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
